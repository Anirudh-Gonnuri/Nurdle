name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Least privilege: jobs only read the repository unless they opt in to more.
permissions:
  contents: read

# One run per branch/PR; a new push cancels the now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0 # git hooks are for local commits, not CI

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check
